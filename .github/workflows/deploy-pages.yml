name: Deploy to GitHub Pages

on:
  # Publish on every push to the default branch.
  push:
    branches: [master]
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

# Least-privilege token that the deploy step needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress deploy finish rather than
# cancelling it (cancelled Pages deploys are a common source of failures).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble publish folder
        # Copy the static site into _site, excluding the Cloudflare Worker
        # backend and repo tooling that must not be served as a web page.
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'api' \
            --exclude '.wrangler' \
            --exclude '.claude' \
            --exclude '__pycache__' \
            --exclude 'README.md'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
